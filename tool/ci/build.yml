name: Build

# Produces real installers so nobody has to install Flutter to try NoteNest.
# Runs on version tags and on demand; artifacts are uploaded for every run, so
# a pull request can ship a test build too.
#
# Note: binaries built here are NOT code-signed. Windows SmartScreen and
# Android's "unknown sources" warning are expected — see the README.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also create a draft GitHub Release containing the artifacts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  version:
    name: Read version from pubspec.yaml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          v=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building NoteNest $v"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the Windows runner, codegen, launcher icon
        shell: pwsh
        run: |
          flutter create . --project-name notenest --org com.notenest --platforms=windows
          git checkout -- lib pubspec.yaml analysis_options.yaml test
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run flutter_launcher_icons
          Copy-Item assets/icon/app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Build release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          iscc /DAppVersion="${{ needs.version.outputs.version }}" tool\windows_installer.iss
          Get-ChildItem -Recurse dist\NoteNest-Setup-*.exe

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build\windows\x64\runner\Release\
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist\NoteNest-Setup-*.exe
          if-no-files-found: warn

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the Android runner and codegen
        run: |
          flutter create . --project-name notenest --org com.notenest --platforms=android
          git checkout -- lib pubspec.yaml analysis_options.yaml test
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run flutter_launcher_icons

      - name: Add the INTERNET permission
        # Android grants INTERNET automatically at install, but only when the
        # manifest declares it. Flutter's template leaves it out of the MAIN
        # manifest, so without this step the release APK has no network and
        # sync fails with "failed host lookup" (errno 7). Fail loudly rather
        # than ship a broken APK.
        run: |
          M=android/app/src/main/AndroidManifest.xml
          test -f "$M" || { echo "manifest missing: $M" >&2; exit 1; }
          if ! grep -q 'android.permission.INTERNET' "$M"; then
            sed -i '0,/<manifest/s//<manifest\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$M"
          fi
          grep -n 'android.permission.INTERNET' "$M" \
            || { echo "ERROR: INTERNET permission missing from $M" >&2; exit 1; }

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [version, windows, android]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/RELEASE_TEMPLATE.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Package the portable Windows build
        run: |
          cd assets
          if [ -d Release ]; then
            zip -qr "NoteNest-${{ needs.version.outputs.version }}-windows-x64.zip" Release
            rm -rf Release
          fi
          ls -la

      - name: Fill in the version placeholders
        run: |
          sed -i "s/{{VERSION}}/${{ needs.version.outputs.version }}/g" .github/RELEASE_TEMPLATE.md
          mv .github/RELEASE_TEMPLATE.md release-notes.md

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NoteNest ${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          body_path: release-notes.md
          files: assets/*
