# Standard Flutter lints. Deliberately not stricter than this: a wall of
# style warnings makes real problems harder to see.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Generated Drift code and long widget trees make these noisy without
    # improving correctness.
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    use_build_context_synchronously: false
