name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two concurrent pushes to the same branch cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # NoteNest supports "any Flutter 3.22 or newer", so CI tracks the latest
  # stable instead of pinning a patch version. The old pin (3.24.5) made the
  # build fail outright: pub resolves `dynamic_color` 1.9.x, which calls
  # Color.toARGB32, and that only exists from Flutter 3.27.
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # The platform runners (android/, windows/) are generated, not committed,
      # so no `flutter create` is needed to analyze and test the Dart sources.
      - name: Install packages
        run: flutter pub get

      - name: Generate Drift code (database.g.dart is git-ignored)
        run: dart run build_runner build --delete-conflicting-outputs

      # --no-fatal-infos: info-level lints (for example the
      # use_build_context_synchronously hints on the mounted-guarded snackbars)
      # are advisory, exactly like the format job. Errors and warnings still
      # fail the pipeline.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Verify generated code is up to date
        run: git diff --exit-code lib/data/db/ || (echo "::error::Commit the regenerated drift code"; exit 1)

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Unit tests
        run: flutter test --reporter expanded

  format:
    name: Format check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
