name: Diag

# TEMPORARY diagnostic for the Build workflow failures. Push-triggered so it can
# run from a feature branch (workflow_dispatch needs the default branch).
# Every interesting line is re-emitted as a ::error:: annotation, because that
# is the only part of a job log reachable from an API client.

on:
  push:

permissions:
  contents: read

jobs:
  windows:
    name: Windows diagnose
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: generate
        shell: bash
        run: |
          set +e
          {
            echo "=== flutter --version ==="
            flutter --version 2>&1
            echo "=== flutter create windows ==="
            flutter create . --project-name notenest --org com.notenest --platforms=windows 2>&1
            echo "exit=$?"
            echo "=== git checkout -- ==="
            git checkout -- lib pubspec.yaml analysis_options.yaml test 2>&1
            echo "exit=$?"
            echo "=== pub get ==="
            flutter pub get 2>&1
            echo "exit=$?"
            echo "=== build_runner ==="
            dart run build_runner build --delete-conflicting-outputs 2>&1
            echo "exit=$?"
            echo "=== launcher icons ==="
            dart run flutter_launcher_icons 2>&1
            echo "exit=$?"
            echo "=== copy ico ==="
            cp -f assets/icon/app_icon.ico windows/runner/resources/app_icon.ico && echo copied
          } > gen.log 2>&1
          grep -nE "Error|error:|Exception|FAILED|Failure|failed|not found|No such|Unsupported|requires" gen.log \
            | head -n 30 | sed 's/^/::error::/'
          tail -n 12 gen.log | sed 's/^/::error::/'

      - name: build
        shell: bash
        run: |
          set +e
          flutter build windows --release > build.log 2>&1
          status=$?
          echo "=== build exit=$status ==="
          grep -nE "Error|error:|Exception|FAILED|failed|not found|No such|Unsupported|CMake" build.log \
            | head -n 30 | sed 's/^/::error::/'
          tail -n 15 build.log | sed 's/^/::error::/'
          exit $status

  android:
    name: Android diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: generate
        run: |
          set +e
          {
            echo "=== flutter --version ==="
            flutter --version 2>&1
            echo "=== java -version ==="
            java -version 2>&1
            echo "=== flutter create android ==="
            flutter create . --project-name notenest --org com.notenest --platforms=android 2>&1
            git checkout -- lib pubspec.yaml analysis_options.yaml test 2>&1
            flutter pub get 2>&1
            dart run build_runner build --delete-conflicting-outputs 2>&1
            dart run flutter_launcher_icons 2>&1
            M=android/app/src/main/AndroidManifest.xml
            if ! grep -q 'android.permission.INTERNET' "$M"; then
              sed -i '0,/<manifest/s//<manifest\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$M"
            fi
            grep -n 'android.permission.INTERNET' "$M" 2>&1
            echo "=== gradle files ==="
            grep -rn "compileSdk\|targetSdk\|minSdk\|sourceCompatibility\|JavaVersion" android/app/build.gradle* 2>&1 | head -n 20
          } > gen.log 2>&1
          tail -n 20 gen.log | sed 's/^/::error::/'

      - name: build
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          status=$?
          echo "=== build exit=$status ==="
          grep -nE "error|Error|FAILURE|What went wrong|Exception|Unsupported|requires|Could not" build.log \
            | head -n 30 | sed 's/^/::error::/'
          tail -n 20 build.log | sed 's/^/::error::/'
          exit $status
